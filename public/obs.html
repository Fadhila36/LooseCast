<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LooseCast OBS Overlay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;}
/* #stage selalu 1920×1080 di-scale ke viewport — semua posisi px di dalamnya akurat */
#stage{
  position:fixed;
  top:0;left:0;
  width:1920px;
  height:1080px;
  transform-origin:top left;
  pointer-events:none;
}
#mw{position:absolute;display:none;pointer-events:none;}
#mw img{display:block;width:100%;height:100%;object-fit:contain;}
#mw video{display:none;width:100%;height:100%;object-fit:contain;}
#mw canvas{display:none;width:100%;height:100%;}

/* FX Layer */
#fx-canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  display: none;
  z-index: 999;
}
#flash-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #ffffff;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.1s ease-out;
  z-index: 998;
}

/* Animations */
@keyframes fadeIn    {from{opacity:0}to{opacity:1}}
@keyframes fadeOut   {from{opacity:1}to{opacity:0}}
@keyframes popIn     {from{opacity:0;transform:scale(0.3)}to{opacity:1;transform:scale(1)}}
@keyframes popOut    {from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(0.3)}}
@keyframes slideUpIn {from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUpOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-80px)}}
@keyframes slideDnIn {from{opacity:0;transform:translateY(-80px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDnOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(80px)}}
@keyframes slideLIn  {from{opacity:0;transform:translateX(-100px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideLOut {from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-100px)}}
@keyframes slideRIn  {from{opacity:0;transform:translateX(100px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideROut {from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(100px)}}
@keyframes bounceIn  {0%{opacity:0;transform:scale(0.2)}60%{transform:scale(1.15)}80%{transform:scale(0.95)}100%{opacity:1;transform:scale(1)}}
@keyframes zoomRotIn {from{opacity:0;transform:scale(0.2)rotate(-15deg)}to{opacity:1;transform:scale(1)rotate(0)}}
@keyframes zoomRotOut{from{opacity:1;transform:scale(1)rotate(0)}to{opacity:0;transform:scale(0.2)rotate(15deg)}}
@keyframes flipIn    {from{opacity:0;transform:perspective(600px)rotateY(90deg)}to{opacity:1;transform:perspective(600px)rotateY(0)}}
@keyframes flipOut   {from{opacity:1;transform:perspective(600px)rotateY(0)}to{opacity:0;transform:perspective(600px)rotateY(-90deg)}}

/* Screen Shake Keyframes */
@keyframes screenShake {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  10%, 50%, 90% { transform: translate(-14px, 10px) rotate(-1.2deg); }
  20%, 60% { transform: translate(16px, -12px) rotate(1.5deg); }
  30%, 70% { transform: translate(-18px, -10px) rotate(-1deg); }
  40%, 80% { transform: translate(14px, 14px) rotate(1.2deg); }
}
.shaking {
  animation: screenShake 0.45s ease-in-out infinite alternate !important;
}
</style>
</head>
<body>
<div id="stage">
  <div id="flash-overlay"></div>
  <canvas id="fx-canvas" width="1920" height="1080"></canvas>
  <div id="mw">
    <img id="mi" src="" alt="" style="display:none">
    <video id="mv" src="" style="display:none" playsinline></video>
    <canvas id="mc" style="display:none"></canvas>
  </div>
</div>
<audio id="ma"></audio>

<script src="/socket.io/socket.io.js"></script>
<script>
let stageW = 1920;
let stageH = 1080;
let currentScale = 1;

// URL parameter detection (e.g., obs.html?format=tiktok or obs.html?w=1080&h=1920)
const urlParams = new URLSearchParams(window.location.search);
const fmtParam = (urlParams.get('format') || '').toLowerCase();
const wParam = parseInt(urlParams.get('w') || urlParams.get('width'), 10);
const hParam = parseInt(urlParams.get('h') || urlParams.get('height'), 10);

if (wParam && hParam) {
  stageW = wParam;
  stageH = hParam;
} else if (fmtParam === 'tiktok' || fmtParam === 'portrait' || fmtParam === 'shorts' || fmtParam === 'vertical') {
  stageW = 1080;
  stageH = 1920;
} else if (fmtParam === 'square') {
  stageW = 1080;
  stageH = 1080;
} else if (fmtParam === 'classic') {
  stageW = 1440;
  stageH = 1080;
} else if (window.innerHeight > window.innerWidth && window.innerWidth < 1200) {
  stageW = 1080;
  stageH = 1920;
}

function scaleStage(){
  const stage = document.getElementById('stage');
  const fxCanvas = document.getElementById('fx-canvas');
  if(!stage) return;

  stage.style.width = stageW + 'px';
  stage.style.height = stageH + 'px';
  if(fxCanvas){
    fxCanvas.width = stageW;
    fxCanvas.height = stageH;
  }

  const scaleX = window.innerWidth  / stageW;
  const scaleY = window.innerHeight / stageH;
  currentScale = Math.min(scaleX, scaleY);
  stage.style.transform = 'scale('+currentScale+')';
  const ox = (window.innerWidth  - stageW * currentScale) / 2;
  const oy = (window.innerHeight - stageH * currentScale) / 2;
  stage.style.left = ox+'px';
  stage.style.top  = oy+'px';
}
scaleStage();
window.addEventListener('resize', scaleStage);
window.addEventListener('load', scaleStage);
document.addEventListener('DOMContentLoaded', scaleStage);

const socket = io();
const stage = document.getElementById('stage');
const mw = document.getElementById('mw');
const mi = document.getElementById('mi');
const mv = document.getElementById('mv');
const mc = document.getElementById('mc');
const ctx = mc.getContext('2d',{willReadFrequently:true});
const ma = document.getElementById('ma');
const flashEl = document.getElementById('flash-overlay');
const fxCanvas = document.getElementById('fx-canvas');
const fxCtx = fxCanvas.getContext('2d');

// Unlock audio autoplay policy when previewed in browser tab
function unlockAudio() {
  if (ma) { ma.play().then(() => ma.pause()).catch(()=>{}); }
  if (mv) { mv.play().then(() => mv.pause()).catch(()=>{}); }
}
window.addEventListener('click', unlockAudio, { once: true });
window.addEventListener('touchstart', unlockAudio, { once: true });

const IN ={fade:'fadeIn',pop:'popIn','slide-up':'slideUpIn','slide-down':'slideDnIn','slide-left':'slideLIn','slide-right':'slideRIn',bounce:'bounceIn','zoom-rotate':'zoomRotIn',flip:'flipIn'};
const OUT={fade:'fadeOut',pop:'popOut','slide-up':'slideUpOut','slide-down':'slideDnOut','slide-left':'slideLOut','slide-right':'slideROut','zoom-rotate':'zoomRotOut',flip:'flipOut'};

let hideTimer=null, hiding=false, queued=null, curData=null;
let chromaRAF=null, chromaInitTimer=null;
let masterVolume = 1;
const activeSoundboardAudios = new Set();

function getType(n){
  if (!n) return 'image';
  const e=n.split('.').pop().toLowerCase();
  if(['jpg','jpeg','png','gif','webp'].includes(e)) return 'image';
  if(['mp4','webm','mov'].includes(e)) return 'video';
  return 'audio';
}

// ─── MASTER VOLUME & PANIC STOP ──────────────────────────
socket.on('master-volume', data => {
  if (data && typeof data.volume === 'number') {
    const raw = data.volume;
    masterVolume = raw > 1 ? Math.max(0, Math.min(1, raw / 100)) : Math.max(0, Math.min(1, raw));
    if (mv && !mv.paused) {
      const v = (curData && curData.volume ? curData.volume / 100 : 0.8) * masterVolume;
      mv.volume = Math.max(0, Math.min(1, v));
    }
    if (ma && !ma.paused) {
      const v = (curData && curData.volume ? curData.volume / 100 : 0.8) * masterVolume;
      ma.volume = Math.max(0, Math.min(1, v));
    }
    activeSoundboardAudios.forEach(track => {
      track.volume = Math.max(0, Math.min(1, (track._baseVol || 0.8) * masterVolume));
    });
  }
});

socket.on('panic-stop', () => {
  queued = null;
  clearTimeout(hideTimer);
  stopAllSoundboardTracks();
  stopChroma();
  if (confettiRAF) { cancelAnimationFrame(confettiRAF); confettiRAF = null; }
  fxCanvas.style.display = 'none';
  mw.classList.remove('shaking');
  flashEl.style.opacity = '0';
  doHide('fadeOut', 150);
});

function stopAllSoundboardTracks() {
  activeSoundboardAudios.forEach(a => {
    try { a.pause(); a.currentTime = 0; } catch(e){}
  });
  activeSoundboardAudios.clear();
}

// ─── VISUAL FX ENGINE (Screen Shake, Confetti, Flash) ───
socket.on('trigger-fx', data => {
  if (!data) return;
  if (data.fx === 'shake') triggerScreenShake(data.duration || 600);
  else if (data.fx === 'confetti') triggerConfetti(data.duration || 3000);
  else if (data.fx === 'flash') triggerFlash(data.duration || 200);
});

function triggerScreenShake(dur = 600) {
  mw.classList.add('shaking');
  setTimeout(() => mw.classList.remove('shaking'), dur);
}

function triggerFlash(dur = 200) {
  flashEl.style.opacity = '0.75';
  setTimeout(() => { flashEl.style.opacity = '0'; }, dur);
}

let confettiParticles = [];
let confettiRAF = null;

function triggerConfetti(dur = 3000) {
  fxCanvas.style.display = 'block';
  confettiParticles = [];
  const colors = ['#38bdf8', '#ef4444', '#22c55e', '#f59e0b', '#a855f7', '#ec4899', '#ffffff'];
  
  for (let i = 0; i < 120; i++) {
    confettiParticles.push({
      x: Math.random() * 1920,
      y: -20 - Math.random() * 200,
      w: 8 + Math.random() * 10,
      h: 12 + Math.random() * 14,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 6,
      vy: 4 + Math.random() * 6,
      rot: Math.random() * 360,
      vrot: (Math.random() - 0.5) * 12
    });
  }

  const startTime = Date.now();
  if (confettiRAF) cancelAnimationFrame(confettiRAF);

  function renderConfetti() {
    fxCtx.clearRect(0, 0, 1920, 1080);
    const elapsed = Date.now() - startTime;
    if (elapsed > dur) {
      fxCanvas.style.display = 'none';
      confettiParticles = [];
      return;
    }

    confettiParticles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;

      fxCtx.save();
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate(p.rot * Math.PI / 180);
      fxCtx.fillStyle = p.color;
      fxCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      fxCtx.restore();
    });

    confettiRAF = requestAnimationFrame(renderConfetti);
  }

  renderConfetti();
}

// ─── CHROMA KEY ─────────────────────────────────────────
let chromaVideoCallbackId = null;

function chromaFrame(tr, tg, tb, sens, blend) {
  if (mv.paused || mv.ended || hiding) {
    chromaRAF = null;
    chromaVideoCallbackId = null;
    return;
  }
  const w = mc.width, h = mc.height;
  if (!w || !h) return;

  ctx.drawImage(mv, 0, 0, w, h);
  const frame = ctx.getImageData(0, 0, w, h);
  const d = frame.data;
  
  const sensDist = sens * 442;
  const blendDist = blend * 442;
  const sensSq = sensDist * sensDist;
  const maxDist = sensDist + blendDist;
  const maxSq = maxDist * maxDist;

  for (let i = 0; i < d.length; i += 4) {
    const dr = d[i] - tr;
    const dg = d[i+1] - tg;
    const db = d[i+2] - tb;
    const distSq = dr * dr + dg * dg + db * db;

    if (distSq < sensSq) {
      d[i+3] = 0;
    } else if (distSq < maxSq && blendDist > 0) {
      const dist = Math.sqrt(distSq);
      d[i+3] = Math.round(255 * ((dist - sensDist) / blendDist));
    }
  }
  ctx.putImageData(frame, 0, 0);

  if ('requestVideoFrameCallback' in mv) {
    chromaVideoCallbackId = mv.requestVideoFrameCallback(() => chromaFrame(tr, tg, tb, sens, blend));
  } else {
    chromaRAF = requestAnimationFrame(() => chromaFrame(tr, tg, tb, sens, blend));
  }
}

function startChroma(data, onReady) {
  stopChroma();
  const color = data.chromaColor || '#00ff00';
  const sens = Number(data.chromaSens) || 0.35;
  const blend = Number(data.chromaBlend) || 0.1;
  const tr = parseInt(color.slice(1, 3), 16);
  const tg = parseInt(color.slice(3, 5), 16);
  const tb = parseInt(color.slice(5, 7), 16);

  const tryStart = () => {
    if (mv.videoWidth && mv.videoHeight) {
      chromaInitTimer = null;
      mc.width = mv.videoWidth;
      mc.height = mv.videoHeight;
      mc.style.display = 'block';
      mv.style.display = 'none';
      chromaFrame(tr, tg, tb, sens, blend);
      if (onReady) onReady();
    } else {
      chromaInitTimer = setTimeout(tryStart, 30);
    }
  };
  tryStart();
}

function stopChroma() {
  if (chromaInitTimer) { clearTimeout(chromaInitTimer); chromaInitTimer = null; }
  if (chromaRAF) { cancelAnimationFrame(chromaRAF); chromaRAF = null; }
  if (chromaVideoCallbackId != null && 'cancelVideoFrameCallback' in mv) {
    try { mv.cancelVideoFrameCallback(chromaVideoCallbackId); } catch(e){}
    chromaVideoCallbackId = null;
  }
  mc.style.display = 'none';
}

// ─── SHOW / HIDE ────────────────────────────────────────
function doShow(data){
  hiding = false;
  curData = data;
  const filename = data.filename;
  if (!filename) return;

  // Adapt Stage Format / Resolution per media trigger
  if(data.stageW && data.stageH){
    stageW = Number(data.stageW);
    stageH = Number(data.stageH);
  } else if(data.stageFormat === 'portrait' || data.stageFormat === 'tiktok' || data.stageFormat === 'shorts'){
    stageW = 1080;
    stageH = 1920;
  } else if(data.stageFormat === 'square'){
    stageW = 1080;
    stageH = 1080;
  } else if(data.stageFormat === 'classic'){
    stageW = 1440;
    stageH = 1080;
  } else if(data.stageFormat === 'landscape'){
    stageW = 1920;
    stageH = 1080;
  }
  scaleStage();

  const animIn = data.animIn || 'pop';
  const animOut = data.animOut || 'fade';
  const animInSpeed = Number(data.animInSpeed) || 400;
  const animOutSpeed = Number(data.animOutSpeed) || 350;
  const maxW = data.maxW != null && Number(data.maxW) > 0 ? Number(data.maxW) : 600;
  const maxH = data.maxH != null && Number(data.maxH) > 0 ? Number(data.maxH) : 400;
  const posX = data.posX != null ? Number(data.posX) : Math.round((stageW - maxW) / 2);
  const posY = data.posY != null ? Number(data.posY) : Math.round((stageH - maxH) / 2);

  const vol = data.volume != null ? Number(data.volume) : 80;
  const gain = data.gain != null ? Number(data.gain) : 1;
  const baseVol = Math.max(0, Math.min(1, (vol / 100) * gain));
  const effectiveVol = Math.max(0, Math.min(1, baseVol * masterVolume));

  const companionAudio = data.companionAudio || '';
  const chromaKey = Boolean(data.chromaKey);
  const cropTop = Number(data.cropTop) || 0;
  const cropBottom = Number(data.cropBottom) || 0;
  const cropLeft = Number(data.cropLeft) || 0;
  const cropRight = Number(data.cropRight) || 0;
  const fx = data.fx || '';
  const multiPlay = Boolean(data.multiPlay);
  const isSoundboard = Boolean(data.isSoundboard);

  const type = getType(filename);
  const url = '/assets/' + encodeURIComponent(filename);
  const outAnim = OUT[animOut] || 'fadeOut';

  // Trigger attached FX if configured
  if(fx === 'shake') triggerScreenShake(500);
  else if(fx === 'confetti') triggerConfetti(3000);
  else if(fx === 'flash') triggerFlash(200);

  // Soundboard Multi-track Audio Mode
  if(type === 'audio' && (multiPlay || isSoundboard)){
    const track = new Audio(url);
    track._baseVol = baseVol;
    track.volume = effectiveVol;
    activeSoundboardAudios.add(track);
    const cleanTrack = () => { activeSoundboardAudios.delete(track); };
    track.onended = cleanTrack;
    track.onerror = cleanTrack;
    track.onabort = cleanTrack;
    track.play().catch(cleanTrack);
    return;
  }

  // Position — px absolut di dalam #stage
  mw.style.left   = posX+'px';
  mw.style.top    = posY+'px';
  mw.style.width  = maxW+'px';
  mw.style.height = maxH+'px';

  if(cropTop||cropBottom||cropLeft||cropRight){
    mw.style.clipPath = 'inset('+cropTop+'% '+cropRight+'% '+cropBottom+'% '+cropLeft+'%)';
  } else {
    mw.style.clipPath = 'none';
  }

  clearTimeout(hideTimer);
  hideTimer = null;
  stopChroma();

  // Reset event listeners on media elements to avoid stale event triggers
  mv.onended = null;
  mv.onerror = null;
  mv.onplay = null;
  mv.oncanplay = null;
  ma.onended = null;
  ma.onerror = null;
  ma.onplay = null;

  mi.style.display='none'; mv.style.display='none'; mc.style.display='none';
  mv.pause(); ma.pause();
  mv.currentTime = 0; ma.currentTime = 0;
  mi.src=''; mv.src=''; ma.src='';

  if(companionAudio){
    ma.src='/assets/'+encodeURIComponent(companionAudio);
    ma.volume=Math.max(0, Math.min(1, effectiveVol));
    ma.onerror=()=>{ console.warn('[OBS Overlay] Companion audio error'); };
    ma.onended=()=>{
      if(type==='image' && !data.customDuration && !data.duration){
        if(!hiding) doHide(outAnim, animOutSpeed);
      }
    };
    ma.play().catch((e)=>{ console.warn('[OBS Overlay] Companion audio play error:', e); });
  }

  if(type==='audio'){
    console.log('[OBS Overlay] Playing audio:', url, 'effectiveVol:', effectiveVol);
    ma.src=url;
    ma.volume=Math.max(0, Math.min(1, effectiveVol));
    ma.onerror=(e)=>{
      console.warn('[OBS Overlay] Audio load error for:', url, e);
      if(!hiding) doHide(outAnim, animOutSpeed);
    };
    ma.onended=()=>{ if(!hiding) doHide(outAnim, animOutSpeed); };
    ma.play().catch((err)=>{
      console.warn('[OBS Overlay] Audio play promise rejected:', err);
      if(err && err.name === 'AbortError') return;
      if(!hiding) doHide(outAnim, animOutSpeed);
    });
    mw.style.display='none'; return;
  }

  if(type==='image'){
    console.log('[OBS Overlay] Showing image:', url);
    mi.src=url; mi.style.display='block';
    mi.onerror=(e)=>{
      console.warn('[OBS Overlay] Image load error for:', url, e);
      if(!hiding) doHide(outAnim, animOutSpeed);
    };
    playShow();

    const imgDuration = Number(data.customDuration || data.duration) || 5;
    if(imgDuration > 0){
      hideTimer=setTimeout(()=>{
        if(!hiding) doHide(outAnim, animOutSpeed);
      }, imgDuration * 1000);
    }
  } else {
    console.log('[OBS Overlay] Playing video:', url, 'effectiveVol:', effectiveVol);
    
    // Exact playback speed enforcement
    const speed = (data.playbackRate != null && Number(data.playbackRate) > 0) 
      ? Number(data.playbackRate) 
      : ((data.speed != null && Number(data.speed) > 0) ? Number(data.speed) : 1.0);

    mv.playbackRate = speed;
    mv.defaultPlaybackRate = speed;
    mv.loop = false;
    mv.volume = Math.max(0, Math.min(1, effectiveVol));
    mv.src = url;
    mv.currentTime = 0;

    mv.onerror = (e) => {
      console.warn('[OBS Overlay] Video load error for:', url, e);
      if (!hiding) doHide(outAnim, animOutSpeed);
    };

    mv.onended = () => {
      if (!hiding) doHide(outAnim, animOutSpeed);
    };

    const playPromise = mv.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        mv.playbackRate = speed;
      }).catch((err) => {
        console.warn('[OBS Overlay] Video play promise rejected:', err);
        if (err && err.name === 'AbortError') return;
      });
    }

    if(chromaKey){
      mv.style.display='none';
      mw.style.display='none';
      startChroma(data, ()=>{
        if(!hiding) playShow();
      });
    } else {
      mv.style.display='block';
      mc.style.display='none';
      playShow();
    }
    
    // Explicit custom video duration override if specified, otherwise safety fallback 10 mins
    if (data.customDuration && Number(data.customDuration) > 0) {
      hideTimer = setTimeout(()=>{
        if(!hiding) doHide(outAnim, animOutSpeed);
      }, Number(data.customDuration) * 1000);
    } else {
      hideTimer = setTimeout(()=>{
        if(!hiding && (mv.ended || mv.paused)) {
          doHide(outAnim, animOutSpeed);
        }
      }, 600000);
    }
    return;
  }

  function playShow(){
    mw.style.display='block';
    mw.style.animation='';
    void mw.offsetWidth;
    mw.style.animation=`${IN[animIn]||'fadeIn'} ${animInSpeed}ms cubic-bezier(0.34,1.56,0.64,1) forwards`;
  }
}

function doHide(anim='fadeOut', speed=300){
  clearTimeout(hideTimer);
  hideTimer = null;
  if(mw.style.display==='none'){
    hiding=false;
    if(queued){ const d=queued; queued=null; doShow(d); }
    return;
  }
  hiding=true;
  mv.pause();
  ma.pause();
  stopChroma();
  mw.style.animation=`${anim} ${speed}ms ease forwards`;
  setTimeout(()=>{
    mw.style.display='none';
    mw.style.animation='';
    mi.style.display='none'; mv.style.display='none'; mc.style.display='none';
    mv.onended = null; mv.onerror = null;
    ma.onended = null; ma.onerror = null;
    mi.src=''; mv.src=''; ma.src='';
    hiding=false;
    if(queued){ const d=queued; queued=null; doShow(d); }
  }, speed);
}

socket.on('show-media', data=>{
  clearTimeout(hideTimer);
  const queue=data.queueMode===true;

  if(hiding){
    queued=data; return;
  }

  if(mw.style.display!=='none'&&queue){
    queued=data;
    const ao=OUT[curData&&curData.animOut||'fade']||'fadeOut';
    const spd=curData&&curData.animOutSpeed||350;
    doHide(ao,spd);
  } else {
    doShow(data);
  }
});

socket.on('hide-media',()=>{ queued=null; doHide(); });
</script>
</body>
</html>
