<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LooseCast — Starting</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090a10;
  --panel: #121520;
  --panel2: #181d2c;
  --panel3: #22283c;
  --brand: #e11d48;
  --brand-hover: #f43f5e;
  --brand-glow: rgba(225, 29, 72, 0.45);
  --brand-dim: rgba(225, 29, 72, 0.12);
  --brand-border: rgba(225, 29, 72, 0.4);
  --ac: #0ea5e9;
  --bd: rgba(255, 255, 255, 0.08);
  --bd2: rgba(255, 255, 255, 0.15);
  --tx: #f8fafc;
  --tx2: #94a3b8;
  --tx3: #64748b;
  --r-md: 14px;
  --r-lg: 20px;
  --r-full: 9999px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  -webkit-user-drag: none;
}

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--tx);
  perspective: 1000px;
}

/* Splash Card Shell with Glass Depth & Specular Border */
.splash-container {
  width: 440px;
  background: radial-gradient(120% 120% at 50% 0%, #171b29 0%, #0c0e16 100%);
  border: 1px solid var(--bd2);
  border-radius: var(--r-lg);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9), 0 0 40px var(--brand-dim), 0 0 0 1px rgba(255, 255, 255, 0.06);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  padding: 28px 26px 22px;
  transform-style: preserve-3d;
  animation: splashEntrance 0.7s var(--ease) forwards;
}

@keyframes splashEntrance {
  0% {
    opacity: 0;
    transform: scale(0.92) translateY(16px);
  }
  100% {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

/* Background Animated Canvas */
#wave-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: 0.65;
  z-index: 1;
}

/* Top Laser Edge */
.top-laser-beam {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent 0%, var(--brand) 30%, #fb7185 50%, var(--brand) 70%, transparent 100%);
  background-size: 200% 100%;
  animation: laserSlide 2.5s ease-in-out infinite alternate;
  z-index: 3;
}

@keyframes laserSlide {
  0% { background-position: 0% 0%; }
  100% { background-position: 100% 0%; }
}

.splash-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
}

/* Header Area */
.splash-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 22px;
}

/* Animated 3D Logo Badge with Rotating Orbit Ring */
.logo-wrap {
  position: relative;
  width: 56px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.orbit-ring {
  position: absolute;
  inset: -3px;
  border-radius: var(--r-md);
  border: 1.5px dashed var(--brand);
  opacity: 0.55;
  animation: rotateOrbit 12s linear infinite;
}

@keyframes rotateOrbit {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.logo-badge {
  width: 50px;
  height: 50px;
  border-radius: var(--r-md);
  background: linear-gradient(145deg, #1c2233 0%, #111420 100%);
  border: 1px solid var(--brand-border);
  box-shadow: 0 4px 20px var(--brand-glow);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--brand);
  position: relative;
  overflow: hidden;
}

.logo-badge::after {
  content: '';
  position: absolute;
  inset: -100%;
  background: linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.18) 50%, transparent 60%);
  animation: badgeShine 3s ease-in-out infinite;
}

@keyframes badgeShine {
  0%, 70% { transform: translateX(-100%) translateY(-100%); }
  100% { transform: translateX(100%) translateY(100%); }
}

.logo-badge svg {
  width: 28px;
  height: 28px;
  filter: drop-shadow(0 0 6px var(--brand-glow));
}

.brand-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.title {
  font-family: 'Syne', sans-serif;
  font-size: 1.45rem;
  font-weight: 900;
  letter-spacing: 1.5px;
  color: var(--tx);
  line-height: 1.1;
  display: flex;
  align-items: center;
}

.title span {
  color: var(--brand);
  text-shadow: 0 0 16px var(--brand-glow);
}

.tagline {
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--tx3);
  letter-spacing: 1.2px;
  text-transform: uppercase;
}

.version-pill {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem;
  font-weight: 700;
  color: var(--brand-hover);
  background: var(--brand-dim);
  border: 1px solid var(--brand-border);
  padding: 3px 8px;
  border-radius: var(--r-full);
  box-shadow: 0 0 10px var(--brand-dim);
}

/* Telemetry Status Display */
.telemetry-card {
  background: rgba(10, 12, 18, 0.7);
  border: 1px solid var(--bd);
  backdrop-filter: blur(10px);
  border-radius: var(--r-md);
  padding: 12px 14px;
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.telemetry-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.telemetry-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.8px;
  color: var(--tx2);
  text-transform: uppercase;
}

.pulse-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 0 8px var(--brand);
  animation: pulseDot 1s ease-in-out infinite alternate;
}

@keyframes pulseDot {
  0% { transform: scale(0.8); opacity: 0.6; }
  100% { transform: scale(1.3); opacity: 1; }
}

.status-percent {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--brand-hover);
}

.status-text {
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--tx);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-height: 18px;
}

/* Hyper-Glow Dual Progress Bar */
.progress-track {
  width: 100%;
  height: 6px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: var(--r-full);
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #9f1239 0%, var(--brand) 60%, #fda4af 100%);
  border-radius: var(--r-full);
  position: relative;
  transition: width 0.35s var(--ease);
  box-shadow: 0 0 14px var(--brand);
}

.progress-fill::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  right: 0;
  width: 16px;
  background: #ffffff;
  border-radius: var(--r-full);
  filter: blur(2px);
  opacity: 0.9;
}

/* Footer Telemetry Meta */
.splash-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.58rem;
  color: var(--tx3);
  letter-spacing: 0.5px;
}

.engine-tag {
  font-family: 'JetBrains Mono', monospace;
  color: var(--tx2);
  display: flex;
  align-items: center;
  gap: 5px;
}

.engine-tag svg {
  color: var(--brand);
}

/* Reduced Motion Override */
@media (prefers-reduced-motion: reduce) {
  .splash-container { animation: none; }
  .top-laser-beam { animation: none; }
  .orbit-ring { animation: none; }
  .logo-badge::after { animation: none; }
  .pulse-dot { animation: none; }
  .progress-fill { transition: none; }
}
</style>
</head>
<body>

<div class="splash-container">
  <div class="top-laser-beam"></div>
  <canvas id="wave-canvas"></canvas>

  <div class="splash-content">
    <div class="splash-header">
      <div class="logo-wrap">
        <div class="orbit-ring"></div>
        <div class="logo-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <polygon points="12 3 19 8 19 16 12 21 5 16 5 8 12 3" stroke-width="1.5"></polygon>
            <circle cx="12" cy="12" r="3" fill="currentColor"></circle>
          </svg>
        </div>
      </div>
      <div class="brand-meta">
        <div class="title">LOOSE<span>CAST</span></div>
        <div class="tagline">Local System Casting Stream</div>
      </div>
      <div class="version-pill">v1.0.0</div>
    </div>

    <div class="telemetry-card">
      <div class="telemetry-row">
        <div class="telemetry-tag">
          <div class="pulse-dot"></div>
          <span>Stream Desk Telemetry</span>
        </div>
        <div class="status-percent" id="status-pct">0%</div>
      </div>
      <div class="status-text" id="status-msg">Memulai sistem...</div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
      </div>
    </div>

    <div class="splash-footer">
      <div class="engine-tag">
        <svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span>NODEJS + OBS V5 ENGINE</span>
      </div>
      <div>STANDALONE OFFLINE</div>
    </div>
  </div>
</div>

<script>
  // ─── 1. INTERACTIVE AUDIO WAVE & NEBULA PARTICLE CANVAS ───
  const canvas = document.getElementById('wave-canvas');
  const ctx = canvas.getContext('2d');
  let animationFrame;
  let particles = [];
  let width, height;

  function resizeCanvas() {
    width = canvas.width = canvas.offsetWidth;
    height = canvas.height = canvas.offsetHeight;
    initParticles();
  }

  function initParticles() {
    particles = [];
    const count = 32;
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 2 + 0.8,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        alpha: Math.random() * 0.6 + 0.2
      });
    }
  }

  let step = 0;
  function renderCanvas() {
    ctx.clearRect(0, 0, width, height);

    // Draw Smooth Sine Frequency Wave
    step += 0.03;
    ctx.beginPath();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(225, 29, 72, 0.25)';
    for (let x = 0; x < width; x += 4) {
      const y = Math.sin(x * 0.02 + step) * 14 + Math.sin(x * 0.04 - step * 0.5) * 8 + (height * 0.65);
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Second Harmonics Wave
    ctx.beginPath();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(244, 63, 94, 0.15)';
    for (let x = 0; x < width; x += 4) {
      const y = Math.cos(x * 0.025 - step * 1.2) * 10 + (height * 0.68);
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Draw & Connect Floating Particles
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > width) p.vx *= -1;
      if (p.y < 0 || p.y > height) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(244, 63, 94, ${p.alpha})`;
      ctx.fill();

      // Draw faint proximity mesh
      for (let j = i + 1; j < particles.length; j++) {
        const p2 = particles[j];
        const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
        if (dist < 55) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(225, 29, 72, ${0.12 * (1 - dist / 55)})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }

    animationFrame = requestAnimationFrame(renderCanvas);
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  renderCanvas();

  // ─── 2. PROGRESS TELEMETRY ENGINE ───
  const steps = [
    { pct: 15, msg: 'Memeriksa direktori media lokal...' },
    { pct: 35, msg: 'Inisialisasi WebSocket & HTTP Server...' },
    { pct: 60, msg: 'Menghubungkan OBS WebSocket & overlay bus...' },
    { pct: 85, msg: 'Memuat soundboard controller & shortcut...' },
    { pct: 100, msg: 'LooseCast siap digunakan!' },
  ];

  const pBar = document.getElementById('progress-bar');
  const pMsg = document.getElementById('status-msg');
  const pPct = document.getElementById('status-pct');

  let curIdx = 0;
  function updateProgress() {
    if (curIdx < steps.length) {
      const item = steps[curIdx];
      pBar.style.width = item.pct + '%';
      pPct.textContent = item.pct + '%';
      pMsg.textContent = item.msg;
      curIdx++;
      setTimeout(updateProgress, 400 + Math.random() * 200);
    }
  }

  setTimeout(updateProgress, 200);
</script>
</body>
</html>
